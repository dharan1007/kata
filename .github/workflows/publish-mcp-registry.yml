name: Publish KATA to MCP Registry

on:
  workflow_run:
    workflows: ["KATA Production Deploy"]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: kata-mcp-registry-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  REGISTRY_URL: https://registry.modelcontextprotocol.io
  CANONICAL_URL: https://kata-webmcp.vercel.app
  PUBLISHER_VERSION: v1.8.1
  PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact production-verified SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify production-gated source and registry metadata
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python - <<'PY'
          import json
          from pathlib import Path

          package = json.loads(Path('package.json').read_text())
          server = json.loads(Path('server.json').read_text())

          assert server['name'] == 'io.github.dharan1007/kata'
          assert server['version'] == package['version']
          assert 1 <= len(server['description']) <= 100
          assert server['remotes'] == [{
              'type': 'streamable-http',
              'url': 'https://kata-webmcp.vercel.app/api/mcp'
          }]
          assert server['repository']['url'] == 'https://github.com/dharan1007/kata'
          assert server['repository']['source'] == 'github'
          PY

      - name: Verify canonical production is the exact release being published
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 5 --max-time 20 \
            "$CANONICAL_URL/release.json" > /tmp/kata-release.json
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 5 --max-time 20 \
            "$CANONICAL_URL/api/health" > /tmp/kata-health.json
          python - <<'PY'
          import json, os
          from pathlib import Path

          expected_sha = os.environ['EXPECTED_SHA'].lower()
          release = json.loads(Path('/tmp/kata-release.json').read_text())
          health = json.loads(Path('/tmp/kata-health.json').read_text())
          server = json.loads(Path('server.json').read_text())

          assert release.get('source', {}).get('sha') == expected_sha, 'canonical production source SHA differs from Registry publication SHA'
          assert release.get('source', {}).get('provenance') == 'source-bound', 'canonical production is missing source-bound provenance'
          assert health.get('ok') is True
          assert health.get('service') == 'kata-webmcp'
          assert health.get('version') == server['version'], 'canonical production version differs from server.json'
          PY

      - name: Check whether this exact Registry version already exists
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          name="$(python -c "import json; print(json.load(open('server.json'))['name'])")"
          version="$(python -c "import json; print(json.load(open('server.json'))['version'])")"
          response="$(curl --fail --silent --show-error --location --get \
            --data-urlencode "search=$name" \
            --max-time 20 \
            "$REGISTRY_URL/v0.1/servers")"
          set +e
          python - "$name" "$version" "$response" <<'PY'
          import json, sys
          name, version, raw = sys.argv[1:]
          expected = json.load(open('server.json'))
          payload = json.loads(raw)
          for item in payload.get('servers', []):
              server = item.get('server', item)
              if server.get('name') == name and server.get('version') == version:
                  immutable_fields = ('name', 'title', 'description', 'version', 'repository', 'remotes')
                  mismatches = [field for field in immutable_fields if server.get(field) != expected.get(field)]
                  if mismatches:
                      print(f"Registry entry exists but immutable metadata differs: {', '.join(mismatches)}", file=sys.stderr)
                      raise SystemExit(2)
                  raise SystemExit(0)
          raise SystemExit(1)
          PY
          status=$?
          set -e
          case "$status" in
            0) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - name: Install pinned MCP Registry publisher
        if: steps.registry.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --max-time 60 \
            -o "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER_VERSION/$archive"
          echo "$PUBLISHER_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Authenticate with MCP Registry using GitHub OIDC
        if: steps.registry.outputs.exists != 'true'
        shell: bash
        run: ./mcp-publisher login github-oidc

      - name: Publish KATA server metadata
        if: steps.registry.outputs.exists != 'true'
        shell: bash
        run: ./mcp-publisher publish

      - name: Verify Registry publication
        shell: bash
        run: |
          set -euo pipefail
          name="$(python -c "import json; print(json.load(open('server.json'))['name'])")"
          version="$(python -c "import json; print(json.load(open('server.json'))['version'])")"
          for attempt in 1 2 3 4 5 6; do
            response="$(curl --fail --silent --show-error --location --get \
              --data-urlencode "search=$name" \
              --max-time 20 \
              "$REGISTRY_URL/v0.1/servers")"
            if python - "$name" "$version" "$response" <<'PY'
          import json, sys
          name, version, raw = sys.argv[1:]
          expected = json.load(open('server.json'))
          payload = json.loads(raw)
          for item in payload.get('servers', []):
              server = item.get('server', item)
              if server.get('name') == name and server.get('version') == version:
                  immutable_fields = ('name', 'title', 'description', 'version', 'repository', 'remotes')
                  mismatches = [field for field in immutable_fields if server.get(field) != expected.get(field)]
                  if mismatches:
                      print(f"Registry entry exists but immutable metadata differs: {', '.join(mismatches)}", file=sys.stderr)
                      raise SystemExit(2)
                  raise SystemExit(0)
          raise SystemExit(1)
          PY
            then
              exit 0
            fi
            sleep 5
          done
          echo "Registry did not expose the published KATA version with exact immutable metadata" >&2
          exit 1
