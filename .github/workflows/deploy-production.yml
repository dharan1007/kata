name: KATA Production Deploy

on:
  repository_dispatch:
    types:
      - vercel.deployment.ready

permissions:
  contents: read
  statuses: write

concurrency:
  group: kata-production-${{ github.event.client_payload.id }}
  cancel-in-progress: false

jobs:
  verify:
    name: KATA exact-SHA release gate
    if: >-
      github.event.client_payload.environment == 'production' &&
      github.event.client_payload.git.ref == 'main' &&
      github.event.client_payload.project.id == 'prj_uDsXCo9uynyfgRGQKxVp9pVGL29y'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.client_payload.git.sha }}
      DEPLOYMENT_URL: ${{ github.event.client_payload.url }}
      CANONICAL_PROJECT_ID: prj_uDsXCo9uynyfgRGQKxVp9pVGL29y

    steps:
      - name: Register blocking deployment-check status
        uses: vercel/repository-dispatch/actions/status@30f760c6640485cd92f8c785ef361382555fb712 # v1
        with:
          name: KATA exact-SHA release gate

      - name: Validate Vercel deployment-check payload
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Vercel payload SHA is invalid" >&2; exit 1; }
          test "$EXPECTED_SHA" = "$GITHUB_SHA" || { echo "Candidate is not the current main SHA; refusing stale/out-of-order promotion" >&2; exit 1; }
          test "${{ github.event.client_payload.environment }}" = "production"
          test "${{ github.event.client_payload.git.ref }}" = "main"
          test "${{ github.event.client_payload.project.id }}" = "$CANONICAL_PROJECT_ID"
          DEPLOYMENT_URL="$DEPLOYMENT_URL" node --input-type=module -e "const u=new URL(process.env.DEPLOYMENT_URL); if(u.protocol!=='https:'||u.username||u.password||u.search||u.hash||u.pathname!=='/'||!u.hostname.endsWith('.vercel.app')) throw new Error('unexpected Vercel deployment URL');"

      - name: Checkout exact deployment SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.client_payload.git.sha }}

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Verify deployment candidate and exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || { echo "Deployment checkout is dirty before verification" >&2; git status --short; exit 1; }

      - name: Install exact locked dependency graph
        run: npm ci --ignore-scripts

      - name: Reject known high-severity dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Re-run complete release gate on pre-alias verifier
        run: npm run check

      - name: Verify installable package surface
        run: npm run verify:package

      - name: Generate release SBOM
        run: npm run sbom

      - name: Verify local exact-source release evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/release.json
          test -f dist/integrity.json
          test -f artifacts/kata.spdx.json
          EXPECTED_SHA="$EXPECTED_SHA" node --input-type=module -e "import fs from 'node:fs'; import {createHash} from 'node:crypto'; const r=JSON.parse(fs.readFileSync('dist/release.json','utf8')); const integrity=fs.readFileSync('dist/integrity.json'); const sbom=JSON.parse(fs.readFileSync('artifacts/kata.spdx.json','utf8')); const digest=createHash('sha256').update(integrity).digest('hex'); if(r.source?.sha!==process.env.EXPECTED_SHA.toLowerCase()) throw new Error('local release is not bound to deployment SHA'); if(r.source?.provenance!=='source-bound'||r.source?.authority!=='github-actions') throw new Error('local release lacks GitHub source-bound provenance'); if(r.source?.verification?.clean!==true||r.source?.verification?.headMatches!==true||r.source?.verification?.providerBound!==false) throw new Error('local release lacks clean exact-source verification'); if(r.evidence?.integrity?.sha256!==digest||r.evidence?.integrity?.bytes!==integrity.length) throw new Error('local release/integrity binding mismatch'); if(sbom.spdxVersion!=='SPDX-2.3'||!Array.isArray(sbom.packages)||sbom.packages.length!==1) throw new Error('SBOM contract invalid');"

      - name: Verify candidate Vercel provenance before alias assignment
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 10 --max-time 30 --retry 4 --retry-all-errors --retry-delay 2 "$DEPLOYMENT_URL/release.json" > /tmp/deployment-release.json
          curl -fsS --connect-timeout 10 --max-time 30 --retry 4 --retry-all-errors --retry-delay 2 "$DEPLOYMENT_URL/integrity.json" > /tmp/deployment-integrity.json
          EXPECTED_SHA="$EXPECTED_SHA" node --input-type=module -e "import fs from 'node:fs'; import {createHash} from 'node:crypto'; const r=JSON.parse(fs.readFileSync('/tmp/deployment-release.json','utf8')); const i=fs.readFileSync('/tmp/deployment-integrity.json'); const digest=createHash('sha256').update(i).digest('hex'); if(r.source?.sha!==process.env.EXPECTED_SHA.toLowerCase()) throw new Error('candidate source SHA mismatch'); if(r.source?.provenance!=='source-bound') throw new Error('candidate provenance is not source-bound'); if(r.source?.authority!=='vercel-git') throw new Error('candidate authority is not Vercel Git'); if(r.source?.repository!=='dharan1007/kata'||r.source?.ref!=='main') throw new Error('candidate repository/ref mismatch'); if(r.source?.verification?.providerBound!==true||r.source?.verification?.headMatches!==true||r.source?.verification?.clean!==null) throw new Error('candidate lacks provider-bound exact-source evidence'); if(r.evidence?.integrity?.sha256!==digest||r.evidence?.integrity?.bytes!==i.length) throw new Error('candidate release/integrity binding mismatch');"

      - name: Verify candidate health integrity APIs pricing and commercial readiness
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 10 --max-time 30 --retry 4 --retry-all-errors --retry-delay 2 "$DEPLOYMENT_URL/api/health" > /tmp/deployment-health.json
          curl -fsS --connect-timeout 10 --max-time 30 --retry 4 --retry-all-errors --retry-delay 2 "$DEPLOYMENT_URL/api/capabilities" > /tmp/deployment-capabilities.json
          curl -fsS --connect-timeout 10 --max-time 30 --retry 4 --retry-all-errors --retry-delay 2 "$DEPLOYMENT_URL/api/openapi" > /tmp/deployment-openapi.json
          curl -fsS --connect-timeout 10 --max-time 30 --retry 4 --retry-all-errors --retry-delay 2 "$DEPLOYMENT_URL/api/pricing" > /tmp/deployment-pricing.json
          curl -fsS --connect-timeout 10 --max-time 30 --retry 4 --retry-all-errors --retry-delay 2 "$DEPLOYMENT_URL/api/readiness/commercial" > /tmp/deployment-readiness.json
          EXPECTED_SHA="$EXPECTED_SHA" node --input-type=module -e "import fs from 'node:fs'; const h=JSON.parse(fs.readFileSync('/tmp/deployment-health.json','utf8')); const c=JSON.parse(fs.readFileSync('/tmp/deployment-capabilities.json','utf8')); const o=JSON.parse(fs.readFileSync('/tmp/deployment-openapi.json','utf8')); const p=JSON.parse(fs.readFileSync('/tmp/deployment-pricing.json','utf8')); const q=JSON.parse(fs.readFileSync('/tmp/deployment-readiness.json','utf8')); const i=JSON.parse(fs.readFileSync('/tmp/deployment-integrity.json','utf8')); const r=JSON.parse(fs.readFileSync('/tmp/deployment-release.json','utf8')); const required=['kata_search_research','kata_plan_triage','kata_diagnose_web_interop','kata_apply_command','kata_compile_workflow','kata_execute_program','kata_preview_automation','kata_run_automation']; if(h.ok!==true) throw new Error('candidate health failed'); const tools=c.capabilities?.tools; if(!Array.isArray(tools)) throw new Error('candidate capabilities tools missing'); const names=tools.map(t=>t?.name).filter(Boolean); if(new Set(names).size!==names.length) throw new Error('candidate capabilities contain duplicate tool names'); const missing=required.filter(name=>!names.includes(name)); if(missing.length) throw new Error('candidate capabilities missing required tools: '+missing.join(', ')); if(!o.paths?.['/api/mcp']?.post) throw new Error('candidate OpenAPI MCP contract missing'); if(!Array.isArray(p.plans)||!['free','developer','team','enterprise'].every(id=>p.plans.some(plan=>plan.id===id))) throw new Error('candidate pricing contract incomplete'); const pricingText=JSON.stringify(p); if(/KATA_RAZORPAY|keySecret|webhookSecret|plan_[A-Za-z0-9]+/.test(pricingText)) throw new Error('candidate pricing leaks provider configuration'); if(q.readiness?.sourceBound!==true||q.readiness?.releaseSha!==process.env.EXPECTED_SHA.toLowerCase()||!['ready','blocked'].includes(q.readiness?.status)) throw new Error('commercial readiness is not source-bound to candidate release'); if(Object.keys(i.assets??{}).length<7) throw new Error('candidate integrity manifest incomplete'); if(r.source?.sha!==process.env.EXPECTED_SHA.toLowerCase()) throw new Error('candidate source changed during verification');"
