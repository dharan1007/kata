name: KATA Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kata-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Complete release gate
        run: npm run check
      - name: Verify expected build artifacts
        run: |
          test -f dist/index.html
          test -f dist/style.css
          test -f dist/favicon.svg
          test -f dist/src/main.js
          test -f dist/src/app.js
          test -f dist/src/webmcp.js
          test -f dist/integrity.json
      - name: Upload verified release bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: kata-verified-release
          retention-days: 1
          if-no-files-found: error
          path: |
            api/
            lib/
            dist/
            package.json
            vercel.json
            README.md
            SECURITY.md
