name: KATA Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kata-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Verify clean exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || { echo "Release checkout is dirty before verification" >&2; git status --short; exit 1; }
      - name: Complete release gate
        id: release_gate
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee release-gate.log
      - name: Upload release-gate failure diagnostics
        if: failure() && steps.release_gate.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kata-release-gate-failure-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: error
          path: release-gate.log
      - name: Verify expected build artifacts and source provenance
        run: |
          test -f dist/index.html
          test -f dist/style.css
          test -f dist/favicon.svg
          test -f dist/src/main.js
          test -f dist/src/app.js
          test -f dist/src/webmcp.js
          test -f dist/integrity.json
          test -f dist/release.json
          node --input-type=module -e "import fs from 'node:fs'; import {createHash} from 'node:crypto'; const r=JSON.parse(fs.readFileSync('dist/release.json','utf8')); const integrity=fs.readFileSync('dist/integrity.json'); const digest=createHash('sha256').update(integrity).digest('hex'); if(r.source?.sha !== process.env.GITHUB_SHA.toLowerCase()) throw new Error('release.json is not bound to checked-out GITHUB_SHA'); if(r.source?.provenance !== 'source-bound') throw new Error('release.json has unverified provenance'); if(r.source?.verification?.clean!==true || r.source?.verification?.headMatches!==true) throw new Error('release.json lacks clean exact-source verification'); if(r.evidence?.integrity?.path !== '/integrity.json' || r.evidence?.integrity?.sha256 !== digest || r.evidence?.integrity?.bytes !== integrity.length) throw new Error('release.json is not bound to emitted integrity.json');"
      - name: Upload verified release bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kata-verified-release
          retention-days: 1
          if-no-files-found: error
          path: |
            api/
            lib/
            scripts/
            src/
            tests/
            dist/
            index.html
            style.css
            favicon.svg
            robots.txt
            package.json
            vercel.json
            README.md
            SECURITY.md
