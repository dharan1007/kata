name: Apply WebMCP cancellation patch

on:
  push:
    branches: [fix/webmcp-execution-cancellation]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply exact cancellation wiring patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/webmcp-execution-cancellation
      - name: Apply asserted runtime patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app.js')
          s=p.read_text()
          replacements=[
          ("async function request(path,{method='GET',body}={}){const r=await fetch(path,{method,headers:body?{'Content-Type':'application/json'}:undefined,body:body?JSON.stringify(body):undefined});let data;try{data=await r.json();}catch{throw new Error(`HTTP_${r.status}`);}if(!r.ok||data.ok===false){const e=new Error(data?.error?.code??`HTTP_${r.status}`);e.details=data?.error?.details;throw e;}return data;}",
           "async function request(path,{method='GET',body,signal}={}){signal?.throwIfAborted();const r=await fetch(path,{method,headers:body?{'Content-Type':'application/json'}:undefined,body:body?JSON.stringify(body):undefined,signal});let data;try{data=await r.json();}catch(error){if(signal?.aborted)throw signal.reason??error;throw new Error(`HTTP_${r.status}`);}signal?.throwIfAborted();if(!r.ok||data.ok===false){const e=new Error(data?.error?.code??`HTTP_${r.status}`);e.details=data?.error?.details;throw e;}return data;}"),
          ("  async function invoke(name,args){const data=await request('/api/invoke',{method:'POST',body:{name,arguments:args}});return data.result;}",
           "  async function invoke(name,args,{signal}={}){const data=await request('/api/invoke',{method:'POST',body:{name,arguments:args},signal});signal?.throwIfAborted();return data.result;}"),
          ("  async function search(query=state.lastQuery,limit=8,source='human'){\n    const data=await request(`/api/search?query=${encodeURIComponent(query)}&limit=${Math.max(1,Math.min(25,limit))}`);state.lastQuery=query;state.results=data.works;for(const w of data.works)state.workspace.knownWorks[w.id]=w;activity(`Loaded ${data.works.length} live OpenAlex works for “${query}”.`,source,'search');persist();render();await runTrigger('AFTER_SEARCH',data.works);return data;\n  }",
           "  async function search(query=state.lastQuery,limit=8,source='human',{signal}={}){\n    const data=await request(`/api/search?query=${encodeURIComponent(query)}&limit=${Math.max(1,Math.min(25,limit))}`,{signal});signal?.throwIfAborted();state.lastQuery=query;state.results=data.works;for(const w of data.works)state.workspace.knownWorks[w.id]=w;activity(`Loaded ${data.works.length} live OpenAlex works for “${query}”.`,source,'search');persist();render();await runTrigger('AFTER_SEARCH',data.works,{signal});return data;\n  }"),
          ("  async function previewAutomation(automation,works=candidates()){return invoke('kata_preview_automation',{workspace:state.workspace,works,automation});}",
           "  async function previewAutomation(automation,works=candidates(),{signal}={}){return invoke('kata_preview_automation',{workspace:state.workspace,works,automation},{signal});}"),
          ("  async function runAutomation(id,source='human',works=candidates()){\n    const stored=state.automations.find(a=>a.id===id);if(!stored)throw new Error('AUTOMATION_NOT_FOUND');const p=await previewAutomation(stored,works);const out=await invoke('kata_run_automation',{workspace:state.workspace,works,automation:stored,previewFingerprint:p.preview.fingerprint});state.workspace=out.workspace;activity(`${stored.name}: ${out.receipt.status}, ${out.receipt.processed??0} processed.`,source,'automation',out.receipt);persist();render();return out.receipt;\n  }",
           "  async function runAutomation(id,source='human',works=candidates(),{signal}={}){\n    signal?.throwIfAborted();const stored=state.automations.find(a=>a.id===id);if(!stored)throw new Error('AUTOMATION_NOT_FOUND');const p=await previewAutomation(stored,works,{signal});signal?.throwIfAborted();const out=await invoke('kata_run_automation',{workspace:state.workspace,works,automation:stored,previewFingerprint:p.preview.fingerprint},{signal});signal?.throwIfAborted();state.workspace=out.workspace;activity(`${stored.name}: ${out.receipt.status}, ${out.receipt.processed??0} processed.`,source,'automation',out.receipt);persist();render();return out.receipt;\n  }"),
          ("  async function runTrigger(trigger,works){for(const a of state.automations.filter(x=>x.enabled&&x.trigger===trigger)){try{await runAutomation(a.id,'automation',works);}catch(error){activity(`${a.name}: ${human(error.message)}`,'automation','error',{code:error.message});}}render();}",
           "  async function runTrigger(trigger,works,{signal}={}){signal?.throwIfAborted();for(const a of state.automations.filter(x=>x.enabled&&x.trigger===trigger)){try{await runAutomation(a.id,'automation',works,{signal});}catch(error){if(signal?.aborted)throw signal.reason??error;activity(`${a.name}: ${human(error.message)}`,'automation','error',{code:error.message});}}signal?.throwIfAborted();render();}"),
          ("  async function executeProgram(name,input,source='human'){\n    const p=state.programs.find(x=>x.name===name);if(!p)throw new Error('TOOL_NOT_FOUND');const data=await request('/api/execute',{method:'POST',body:{workspace:state.workspace,program:p,input}});state.workspace=data.workspace;activity(`${name} executed ${data.completed} semantic action(s).`,source,'tool');persist();render();return{completed:data.completed,workspaceSummary:summary()};\n  }",
           "  async function executeProgram(name,input,source='human',{signal}={}){\n    signal?.throwIfAborted();const p=state.programs.find(x=>x.name===name);if(!p)throw new Error('TOOL_NOT_FOUND');const data=await request('/api/execute',{method:'POST',body:{workspace:state.workspace,program:p,input},signal});signal?.throwIfAborted();state.workspace=data.workspace;activity(`${name} executed ${data.completed} semantic action(s).`,source,'tool');persist();render();return{completed:data.completed,workspaceSummary:summary()};\n  }")]
          for old,new in replacements:
              count=s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:80]}')
              s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit asserted patch and remove helper workflow
        run: |
          rm .github/workflows/apply-webmcp-cancellation-patch.yml
          git config user.name "kata-release-bot"
          git config user.email "150376358+dharan1007@users.noreply.github.com"
          git add src/app.js .github/workflows/apply-webmcp-cancellation-patch.yml
          git diff --cached --check
          git commit -m "fix: abort WebMCP browser operations before state commit"
          git push origin HEAD:fix/webmcp-execution-cancellation
